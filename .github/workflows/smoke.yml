name: Live site smoke
# After every push to main, and once a day: ask the real origin — not the repo — whether the site a
# visitor loads is the one we built. Catches a Pages outage, a half-finished push, a stale ?v= asset and
# a street address leaking into the public feed or the season calendar.
#
# The trigger is a push on purpose. It used to listen for GitHub's internal Pages workflow ("pages build
# and deployment"), which is an implementation detail of the hosting: rename it and this check would stop
# running without a single failure. The commit is published within a minute or so; scripts/smoke.mjs
# retries for two minutes, so a normal deploy delay is not a red run.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 13 * * *" # an hour after the feed sync, so a fresh feed is checked too
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Ask the live origin
        run: node scripts/smoke.mjs
