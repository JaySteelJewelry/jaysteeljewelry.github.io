name: Live site smoke
# After GitHub Pages publishes main, and once a day: ask the real origin — not the repo — whether the
# site a visitor loads is the one we built. Catches a Pages outage, a half-finished push, a stale ?v=
# asset and a street address leaking into the public feed. `node scripts/smoke.mjs` runs the same test.
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  schedule:
    - cron: "23 13 * * *" # one hour after the feed sync, so a fresh feed is checked too
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The check compares the live page with the commit that was published, not with main's tip.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Ask the live origin
        run: node scripts/smoke.mjs
