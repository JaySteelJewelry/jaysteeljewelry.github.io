name: Tests
# Every push to main and every pull request runs the whole suite.
# GitHub Pages publishes main directly, so this is the only thing between a bad commit and the live site.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install the one dependency (the Svix webhook SDK)
        run: npm ci
      - name: Tests (site, links, shop API, circuit, feed rules, webhooks)
        run: node --test test/*.test.mjs
      - name: Every ?v= matches its asset
        run: npm run check:assets
      - name: Sitemap dates match the shipped data
        run: npm run check:sitemap
      - name: Season feed is valid
        run: npm run check:events
