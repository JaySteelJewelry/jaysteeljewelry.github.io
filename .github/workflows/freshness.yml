name: Season freshness
# A stale season breaks nothing visible: every page answers, the calendar still parses, and the smoke
# test passes — it just keeps shipping last month's dates. The home page's latest post has the same
# failure mode: a valid file promoting a market that already happened. This is the workflow that goes red.
#
# Two weeks with no change to the feed is a warning; a month is a failure. The same thresholds drive the
# warnings in the live smoke, so the two checks cannot disagree. Runs half an hour after feed-sync.yml,
# so a sync that silently stopped committing is caught the same morning.
on:
  push:
    branches: [main]
  schedule:
    - cron: "47 12 * * *" # 08:47/09:47 Eastern, half an hour after the feed sync
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: freshness
  cancel-in-progress: false
jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Is the season (and the latest post) still current?
        run: npm run check:freshness
